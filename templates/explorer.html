<!-- templates/explorer.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Dicionários</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 15px;
        }

        .load-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .load-section input, .load-section select, .load-section button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .load-section input {
            flex: 1;
            min-width: 200px;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .load-section input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .load-section button {
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .load-section button:hover {
            transform: translateY(-2px);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #f4f4f4;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }

        .path-navigation {
            margin-bottom: 20px;
            font-size: 12px;
            word-break: break-all;
        }

        .path-item {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            margin: 2px;
            cursor: pointer;
            font-size: 12px;
        }

        .path-item:hover {
            background: #764ba2;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .data-viewer {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .data-type {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .dict-item, .list-item {
            border-left: 3px solid #667eea;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dict-item:hover, .list-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .key {
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }

        .value {
            color: #333;
            font-family: monospace;
            margin-top: 5px;
        }

        .value-preview {
            background: #f0f0f0;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
            overflow-x: auto;
        }

        .edit-form {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .edit-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            margin: 10px 0;
        }

        .edit-form button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        .edit-form button:hover {
            background: #764ba2;
        }

        .save-section {
            padding: 20px;
            background: #f4f4f4;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .save-section button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .string-value {
            color: #28a745;
        }

        .number-value {
            color: #17a2b8;
        }

        .boolean-value {
            color: #ffc107;
        }

        .null-value {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Explorador de Dicionários</h1>
            <div class="load-section">
                <input type="text" id="filepath" placeholder="Caminho do arquivo..." value="data.pkl">
                <select id="filetype">
                    <option value="pickle">Pickle (.pkl)</option>
                    <option value="joblib">Joblib (.joblib)</option>
                </select>
                <button onclick="loadFile()">📂 Carregar</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>📍 Navegação</h3>
                <div id="breadcrumb" class="path-navigation"></div>
                <div id="info-panel">
                    <h4>Informações</h4>
                    <p id="file-info">Nenhum arquivo carregado</p>
                </div>
            </div>

            <div class="content-area">
                <div id="alert" class="alert"></div>
                <div id="content"></div>
            </div>
        </div>

        <div class="save-section">
            <button class="btn-primary" onclick="saveFile()">💾 Salvar</button>
            <button class="btn-success" onclick="downloadFile()">⬇️ Download</button>
            <button class="btn-danger" onclick="clearData()">🗑️ Limpar</button>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentPath = [];
        let currentFilename = '';

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }

        async function loadFile() {
            const filepath = document.getElementById('filepath').value;
            const filetype = document.getElementById('filetype').value;

            try {
                const response = await fetch('/api/load', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filepath, filetype})
                });
                const result = await response.json();
                
                if (result.success) {
                    currentData = result.data;
                    currentPath = [];
                    currentFilename = result.filename;
                    renderContent();
                    updateBreadcrumb();
                    document.getElementById('file-info').textContent = `Arquivo: ${currentFilename}`;
                    showAlert('Arquivo carregado com sucesso!', 'success');
                } else {
                    showAlert('Erro ao carregar: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Erro: ' + error.message, 'error');
            }
        }

        async function browse(path) {
            try {
                const response = await fetch('/api/browse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path})
                });
                const result = await response.json();
                
                if (result.success) {
                    currentPath = path;
                    currentData = result.data;
                    renderContent();
                    updateBreadcrumb();
                } else {
                    showAlert('Erro ao navegar: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Erro: ' + error.message, 'error');
            }
        }

        async function editValue(path, value) {
            try {
                const response = await fetch('/api/edit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path, value})
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlert('Valor atualizado com sucesso!', 'success');
                    browse(currentPath);
                } else {
                    showAlert('Erro ao atualizar: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Erro: ' + error.message, 'error');
            }
        }

        async function saveFile() {
            const filepath = document.getElementById('filepath').value;
            const filetype = document.getElementById('filetype').value;
            
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filepath, filetype})
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlert(`Arquivo salvo em: ${result.filepath}`, 'success');
                } else {
                    showAlert('Erro ao salvar: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert('Erro: ' + error.message, 'error');
            }
        }

        async function downloadFile() {
            const filetype = document.getElementById('filetype').value;
            
            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filetype})
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `data.${filetype}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    showAlert('Download iniciado!', 'success');
                } else {
                    showAlert('Erro no download', 'error');
                }
            } catch (error) {
                showAlert('Erro: ' + error.message, 'error');
            }
        }

        function clearData() {
            currentData = null;
            currentPath = [];
            currentFilename = '';
            renderContent();
            updateBreadcrumb();
            document.getElementById('file-info').textContent = 'Nenhum arquivo carregado';
            showAlert('Dados limpos!', 'success');
        }

        function renderContent() {
            const container = document.getElementById('content');
            
            if (!currentData) {
                container.innerHTML = '<div class="data-viewer"><p>Nenhum dado carregado. Carregue um arquivo para começar.</p></div>';
                return;
            }
            
            const type = getType(currentData);
            const typeName = getTypeName(currentData);
            
            let html = `
                <div class="data-viewer">
                    <div class="data-header">
                        <h3>Conteúdo</h3>
                        <span class="data-type">${typeName}</span>
                    </div>
            `;
            
            if (type === 'dict') {
                html += renderDict(currentData);
            } else if (type === 'list') {
                html += renderList(currentData);
            } else {
                html += renderPrimitive(currentData);
                html += renderEditForm(currentData);
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderDict(data) {
            let html = '<div class="dict-container">';
            for (const [key, value] of Object.entries(data)) {
                const valueType = getType(value);
                const preview = getPreview(value);
                const valueClass = getValueClass(value);
                
                html += `
                    <div class="dict-item" onclick="navigateTo(['${key}'])">
                        <div class="key">🔑 ${escapeHtml(key)}</div>
                        <div class="value">
                            <span class="${valueClass}">${escapeHtml(preview)}</span>
                            <span style="font-size: 11px; color: #999;"> (${getTypeName(value)})</span>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            return html;
        }
        
        function renderList(data) {
            let html = '<div class="list-container">';
            data.forEach((item, index) => {
                const preview = getPreview(item);
                const valueClass = getValueClass(item);
                
                html += `
                    <div class="list-item" onclick="navigateTo(['${index}'])">
                        <div class="key">📌 Índice ${index}</div>
                        <div class="value">
                            <span class="${valueClass}">${escapeHtml(preview)}</span>
                            <span style="font-size: 11px; color: #999;"> (${getTypeName(item)})</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }
        
        function renderPrimitive(data) {
            const valueClass = getValueClass(data);
            return `
                <div class="primitive-value">
                    <h4>Valor atual:</h4>
                    <div class="value-preview">
                        <span class="${valueClass}" style="font-size: 16px;">${escapeHtml(String(data))}</span>
                    </div>
                </div>
            `;
        }
        
        function renderEditForm(currentValue) {
            return `
                <div class="edit-form">
                    <h4>✏️ Editar valor</h4>
                    <textarea id="editValue" rows="5" placeholder="Digite o novo valor (JSON ou texto)...">${escapeHtml(String(currentValue))}</textarea>
                    <button onclick="saveCurrentValue()">💾 Salvar alteração</button>
                    <button onclick="cancelEdit()">❌ Cancelar</button>
                </div>
            `;
        }
        
        function saveCurrentValue() {
            const newValue = document.getElementById('editValue').value;
            editValue(currentPath, newValue);
        }
        
        function cancelEdit() {
            renderContent();
        }
        
        function navigateTo(key) {
            const newPath = [...currentPath, ...key];
            browse(newPath);
        }
        
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '<div style="margin-bottom: 10px;">';
            
            html += `<span class="path-item" onclick="browse([])">🏠 Raiz</span>`;
            
            for (let i = 0; i < currentPath.length; i++) {
                html += ` / <span class="path-item" onclick="browse(${JSON.stringify(currentPath.slice(0, i + 1))})">${escapeHtml(String(currentPath[i]))}</span>`;
            }
            
            html += '</div>';
            breadcrumb.innerHTML = html;
        }
        
        function getType(obj) {
            if (obj === null) return 'null';
            if (Array.isArray(obj)) return 'list';
            return typeof obj;
        }
        
        function getTypeName(obj) {
            if (obj === null) return 'null';
            if (Array.isArray(obj)) return `Array[${obj.length}]`;
            if (typeof obj === 'object') return `Object[${Object.keys(obj).length}]`;
            if (typeof obj === 'string') return `String (${obj.length})`;
            return typeof obj;
        }
        
        function getPreview(obj) {
            if (obj === null) return 'null';
            if (typeof obj === 'string') {
                if (obj.length > 50) return obj.substring(0, 50) + '...';
                return obj;
            }
            if (typeof obj === 'number') return String(obj);
            if (typeof obj === 'boolean') return String(obj);
            if (Array.isArray(obj)) return `[${obj.length} items]`;
            if (typeof obj === 'object') return `{${Object.keys(obj).length} keys}`;
            return String(obj);
        }
        
        function getValueClass(obj) {
            if (obj === null) return 'null-value';
            if (typeof obj === 'string') return 'string-value';
            if (typeof obj === 'number') return 'number-value';
            if (typeof obj === 'boolean') return 'boolean-value';
            return '';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
